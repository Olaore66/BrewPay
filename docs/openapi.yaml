  /api/v1/ledger/journals:
    post:
      tags: [Ledger]
      operationId: postJournal
      summary: Post a balanced journal
      description: |
        Owner only. This is a manual journal, not a transfer and not a
        collection. Collections and successful transfers post their own journals.

        Send header `Idempotency-Key`. Generate a new key for each new post
        the user confirms. Retry the same key only with the same body. The
        key is 8 to 128 characters, starts with a letter or digit, then uses
        letters, digits, `.`, `_`, `:`, and `-`. A UUID is valid.

        The same key and the same lines return the first journal again, still
        with HTTP 201. The same key with a different body returns 409
        `Idempotency key was already used with a different request.`
        A rejected post does not consume the key.

        At least two lines are required. Debits must equal credits. Amounts
        are positive kobo. The server stores currency `NGN`. The client does
        not send a currency.

        Business errors, all 400 `BAD_REQUEST`:

        - `Idempotency key is required.`
        - `Idempotency key is invalid.`
        - `Journal is not balanced.`
        - `Journal needs at least two lines.`
        - `Journal amount must be positive.`
        - `Journal amount is too large.`
        - `Journal description is invalid.`
        - `Journal line direction is invalid.`

        A line that names an account outside this organization returns 404
        `Account was not found.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostJournalRequest"
            example:
              description: Till sales
              lines:
                - accountId: 11111111-1111-1111-1111-111111111111
                  direction: DEBIT
                  amountKobo: 150000
                - accountId: 22222222-2222-2222-2222-222222222222
                  direction: CREDIT
                  amountKobo: 150000
      responses:
        "201":
          description: The journal. A replay of the same key returns this same journal.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Journal"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: A line names an account that is not in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: Account was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
    get:
      tags: [Ledger]
      operationId: listJournals
      summary: List journals
      description: |
        Owner only. Oldest first. Each journal includes its lines. This is
        the history of money movement. It is not a balance API.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Journals in this organization.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Journal"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/ledger/journals/{id}:
    get:
      tags: [Ledger]
      operationId: getJournal
      summary: Read one journal
      description: |
        Owner only. Another organization's journal and an unknown id both
        return 404 `Journal was not found.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
