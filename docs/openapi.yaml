  /api/v1/beneficiaries:
    post:
      tags: [Beneficiaries]
      operationId: saveBeneficiary
      summary: Save a payee
      description: |
        Owner only. The body is the account number and the bank code. There
        is no nickname and no `Idempotency-Key`. The server asks the bank for
        the name and stores it.

        The same organization, account number, and bank code are stored once.
        A later save returns that first row with HTTP 201. It does not ask
        the bank again and it does not change the stored name. A different
        bank code is a different beneficiary. Another organization can save
        the same account and receives its own row.

        If the screen needs a fresh name after the first save, call name
        enquiry. That does not update the beneficiary.

        Saving posts no journal, stores no name-enquiry row, and does not
        submit a transfer.

        On the local fake, the first save of an account returns `Fake Account`.

        Errors match name enquiry:

        - 404 `Account name was not found.` Nothing is stored.
        - 400 `Provider did not answer.` Nothing is stored.
        - 400 `Destination account number is invalid.` The bank is not called.
        - 400 `Destination bank code is invalid.` The bank is not called.
        - 400 `Account name is invalid.` Nothing is stored.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationAccountRequest"
            example:
              destinationAccountNumber: "0123456789"
              destinationBankCode: "058"
      responses:
