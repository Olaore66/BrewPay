          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: Transfer was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/account-name-enquiries:
    post:
      tags: [Name enquiry]
      operationId: enquireAccountName
      summary: Ask the bank for the account name
      description: |
        Owner only. Use this on the payout form while the user types an
        account number and bank code, or before they confirm a new payee.

        There is no `Idempotency-Key` and no amount. Every successful answer
        stores a new enquiry. Asking again does not update the previous row.

        The account number is 10 digits. The bank code is 3 to 6 digits.
        The call posts no journal and does not create a transfer.

        On the local fake, the name is `Fake Account`.

        Errors:

        - 404 `Account name was not found.` Nothing is stored.
        - 400 `Provider did not answer.` Nothing is stored.
        - 400 `Destination account number is invalid.` The bank is not called.
        - 400 `Destination bank code is invalid.` The bank is not called.
        - 400 `Account name is invalid.` A name longer than 200 characters. Nothing is stored.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationAccountRequest"
            example:
              destinationAccountNumber: "0123456789"
              destinationBankCode: "058"
      responses:
        "201":
          description: The provider name for this enquiry.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountNameEnquiry"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
