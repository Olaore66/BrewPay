                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/ledger/journals/{id}/reversals:
    post:
      tags: [Ledger]
      operationId: reverseJournal
      summary: Reverse a journal by posting a new one
      description: |
        Owner only. No request body. The server appends a new journal with
        the debit and credit directions swapped and sets `reversesJournalId`
        to the original. The original lines stay as they were.

        A second reversal of that same original returns 409
        `Journal is already reversed.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: The new reversing journal.
          headers:
