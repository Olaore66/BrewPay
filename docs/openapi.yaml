  /api/v1/transfers:
    post:
      tags: [Transfers]
      operationId: submitTransfer
      summary: Pay a Nigerian account
      description: |
        Owner only. Send `Idempotency-Key` using the same rules as a journal
        post. Generate one key when the user confirms the payout. Retry that
        same key with the same body if the response is lost. A different body
        with that key returns 409.

        The destination account number is 10 digits. The bank code is 3 to 6
        digits. Both are trimmed. This call does not require a name enquiry
        or a saved beneficiary. If the screen showed a name, send the account
        number and bank code again here.

        Clearing must be `ASSET`. Merchant must be `LIABILITY`. Amount is
        positive kobo.

        Read `status` on the 201 body:

        - `SUCCESSFUL` means one journal was posted. `journalId` and
          `providerReference` are set. The journal debits the merchant
          liability and credits the clearing asset.
        - `FAILED` means the provider refused. No journal. `journalId` is null.
        - `UNKNOWN` means the provider did not answer. No journal and no
          provider reference. Keep showing it as unknown. Do not mark it paid.
          Sending the same key again returns this same transfer and does not
          submit it again.

        On the local fake, an unscripted transfer is `SUCCESSFUL`.

        A validation failure and a staff denial do not consume the key.

        Business errors, 400 `BAD_REQUEST`:

        - `Idempotency key is required.`
        - `Idempotency key is invalid.`
        - `Transfer amount must be positive.`
        - `Transfer uses two different ledger accounts.`
        - `Clearing account must be an asset.`
        - `Merchant account must be a liability.`
        - `Destination account number is invalid.`
        - `Destination bank code is invalid.`

        A clearing or merchant account outside this organization returns 404
        `Account was not found.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTransferRequest"
            example:
              clearingAccountId: 11111111-1111-1111-1111-111111111111
              merchantAccountId: 22222222-2222-2222-2222-222222222222
              amountKobo: 250000
              destinationAccountNumber: "0123456789"
              destinationBankCode: "058"
      responses:
        "201":
          description: The transfer, including a replay of the same key.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transfer"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: A ledger account on the transfer is not in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: Account was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
    get:
      tags: [Transfers]
      operationId: listTransfers
      summary: List transfers
      description: Owner only. Oldest first. Use `status` to render pending-unknown, failed, and paid.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Transfers in this organization.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/transfers/{id}:
    get:
      tags: [Transfers]
      operationId: getTransfer
      summary: Read one transfer
      description: |
        Owner only. Another organization's transfer and an unknown id both
        return 404 `Transfer was not found.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
