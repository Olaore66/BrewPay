openapi: 3.0.3
info:
  title: BrewPay API
  version: 0.1.0
  description: |
    Contract for the merchant web app. This file matches the routes in this
    repository, including business verification.

    Import this file into Swagger Editor or Postman. The running server does
    not serve Swagger UI yet.

    ## What the frontend is building

    BrewPay is a multi-tenant ledger for one Nigerian SME (the organization).
    The signed-in user is either `OWNER` or `STAFF`. Money is stored only as
    balanced journals in kobo. The bank the merchant sees today is a local
    fake. A real Kolomoni client is not connected.

    Suggested screens, in order:

    1. Sign up. `POST /api/v1/organizations`. Keep `id`. The business is
       `PENDING` and `kycStatus` is `NOT_SUBMITTED`.
    2. Sign in. `POST /api/v1/sessions`. Store `token` in memory. Send
       `Authorization: Bearer <token>` on later calls. The word `Bearer` is
       case-sensitive and must be followed by one space. Login works while
       the business is still pending.
    3. Learn the role. The session body has no role. Call `GET /api/v1/users`
       and match `userId` from the session. `OWNER` sees the money screens
       after verification. `STAFF` can list users and sign out. Every other
       authenticated route returns 403 for staff.
    4. Submit business verification. `POST /api/v1/kyb-submissions`. Until
       the organization is `ACTIVE`, an owner receives 403
       `Business verification is not complete.`
    5. Submit the signed-in person's identity. `POST /api/v1/kyc-submissions`.
       The owner and each staff user do this for themselves. Money calls stay
       closed until that owner's `kycStatus` is also `APPROVED`. Until then
       the owner receives 403 `Identity verification is not complete.`
    6. Ledger setup, owner only, after both approvals. Create an `ASSET` clearing
       account and a `LIABILITY` merchant account before collections or
       transfers.
    7. Collection account. Open it, then show `externalReference` as the
       account the customer pays. Credits appear later on
       `GET /api/v1/collections`. There is no websocket. Poll.
    8. Pay someone. Enquire the account name, save a beneficiary if the
       merchant wants to keep it, then submit a transfer. A transfer does
       not read the beneficiary. Send the account number and bank code again.
    9. Audit and reconciliation are owner operations screens.

    ## Rules that apply to every call

    - Base path is `/api/v1`. Send `Content-Type: application/json` on bodies.
    - `X-Organization-Id` is ignored. The session chooses the organization.
    - Send `X-Correlation-Id` if you want your own id back. It must be 8 to 64
      characters, start with a letter or digit, then use letters, digits,
      `.`, `_`, and `-`. Anything else is replaced. The response header and
      the error body both carry the id the server kept.
    - Lists are JSON arrays, oldest first. There is no page, cursor, or limit.
    - Amounts are integers in kobo. `150000` is 1,500.00 naira. Do not send
      decimals. The currency is always `NGN` and the client does not send it.
    - There is no balance endpoint, no dashboard total, and no pagination.
    - There is no CORS configuration. A browser app on another origin will be
      blocked until a proxy or a later CORS change exists.
    - Unknown routes return 404 `Resource was not found.`
    - Money routes are the ledger, collection accounts, collections, transfers,
      name enquiry, beneficiaries, and reconciliation. An owner whose
      business `kycStatus` is not `APPROVED` receives 403
      `Business verification is not complete.` An owner whose business is
      approved and whose own `kycStatus` is not `APPROVED` receives 403
      `Identity verification is not complete.` Staff on those routes still
      receive 403 `You do not have permission to perform this action.`
    - A body that is not JSON returns 400 `Request could not be read.`
    - Bean validation returns 400 `Request validation failed.` The `details`
      array names each field. Nested owner fields look like `owner.email`.
    - Passwords, session tokens, webhook secrets, and idempotency keys are
      never returned after the call that created them. The login token is
      returned once.

    ## Local server

    `GET /api/v1/health` is the ready check. Port 8080 on the dev machine is
    often Apache httpd. Start the API with `--server.port=8081` when 8080
    is taken. The database is local PostgreSQL `brewpay_db`.

    On this fake bank, a name enquiry and a new beneficiary return the name
    `Fake Account`. A transfer returns `SUCCESSFUL` and posts a journal.
    The merchant app cannot choose those outcomes.

    ## Not built

    Document upload, a named BVN or NIN field, email verification, invite links, a BrewPay
    review queue, password reset, refresh tokens, beneficiary nicknames,
    beneficiary edits, a balance read, fees, numeric limits, and the live
    Kolomoni bank are not in this API. The provider approves or rejects the
    business profile. BrewPay does not decide that verdict.
servers:
  - url: http://localhost:8081
    description: Local API. Use 8081 when Apache httpd holds 8080.
tags:
  - name: Health
    description: Ready check. No session.
  - name: Organizations
    description: Create the merchant business and its owner. No session.
  - name: Business verification
    description: Send the business profile to the provider. Owner only. Does not move money.
  - name: Identity verification
    description: Send the signed-in person's profile to the provider. Does not move money.
  - name: Sessions
    description: Sign in and sign out.
  - name: Users
    description: Staff inside the signed-in organization.
  - name: Audit
    description: Append-only record of what the owner and the system did.
  - name: Ledger
    description: Accounts and balanced journals. Source of truth for money.
  - name: Collections
    description: The account customers pay, and the credits that landed.
  - name: Transfers
    description: Payouts to a Nigerian account number.
  - name: Name enquiry
    description: Ask the bank for the name on an account. Does not move money.
  - name: Beneficiaries
    description: Save a destination once. Does not move money.
  - name: Reconciliation
    description: Compare the bank statement with the ledger. Does not move money.
  - name: Fake bank
    description: Bank-to-server webhook. The merchant app does not call this.
security:
  - bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the API process is up
      description: |
        Use this before showing the app as connected. It does not check the
        database and it does not need a session.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The process is up.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: UP

  /api/v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Sign up a merchant and its owner
      description: |
        This is the only signup call. It creates one organization with status
        `PENDING` and `kycStatus` `NOT_SUBMITTED`, and one user with role
        `OWNER` and status `ACTIVE`.

        It does not collect the business address or registration number.
        Those go to `POST /api/v1/kyb-submissions` after login. Money routes
        stay closed until that verdict is `APPROVED`.

        Keep `id`. Login requires it, because the same email may exist in
        another organization. Email is stored in lowercase. The password is
        bcrypt and is not returned. Login works while the organization is
        `PENDING`.

        There is no `GET` for an organization. The signup response and the
        session are how the app knows the organization id.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
            example:
              name: Ada Stores
              owner:
                firstName: Ada
                lastName: Okeke
                email: ada@example.com
                password: password-1
      responses:
        "201":
          description: Organization and owner were created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"

  /api/v1/kyb-submissions:
    post:
      tags: [Business verification]
      operationId: submitKyb
      summary: Send the business profile to the provider
      description: |
        Owner only. There is no `Idempotency-Key`. The provider returns the
        verdict. BrewPay stores it and does not invent an approval.

        `businessType` is `SOLE_PROPRIETOR`, `PARTNERSHIP`, or
        `LIMITED_COMPANY`. A partnership or limited company must send
        `registrationNumber`. A sole proprietor may omit it. The response
        returns that number. The audit does not.

        `APPROVED` sets the organization to `ACTIVE`. `PENDING` leaves it
        pending. `REJECTED` leaves it pending and the owner can submit again.

        A second submit while the status is `PENDING` is 409
        `Business verification is already in review.` A second submit after
        `APPROVED` is 409 `Business is already verified.` Neither calls the
        provider again.

        The call posts no journal. On the local fake the verdict is
        `APPROVED` unless a test scripts `PENDING` or `REJECTED`. A merchant
        request cannot choose it.

        - 400 `Business type is invalid.` The provider is not called.
        - 400 `Registration number is required.` The provider is not called.
        - 403 `You do not have permission to perform this action.` Staff.
          The provider is not called.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitKybRequest"
            example:
              tradingName: Ada Trading
              businessType: LIMITED_COMPANY
              registrationNumber: RC1234567
              addressLine: 12 Market Road
              state: Lagos
              category: Retail
      responses:
        "201":
          description: The provider verdict was stored.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KybSubmission"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Verification is already pending or already approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: CONFLICT
                message: Business verification is already in review.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
    get:
      tags: [Business verification]
      operationId: listKybSubmissions
      summary: List this organization's verification submissions
      description: |
        Owner only. Oldest first. There is no pagination. Staff receive 403
        and that denial is not a separate KYB audit row.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Submissions for the signed-in organization.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KybSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/kyb-submissions/{id}:
    get:
      tags: [Business verification]
      operationId: getKybSubmission
      summary: Read one verification submission
      description: |
        Owner only. Another organization's id and an unknown id are both
        404 `KYB submission was not found.` `X-Organization-Id` does not
        change that.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The submission.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KybSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No submission with that id in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: KYB submission was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/kyc-submissions:
    post:
      tags: [Identity verification]
      operationId: submitKyc
      summary: Send the signed-in person's identity to the provider
      description: |
        Any signed-in user submits their own identity. There is no user id
        in the body and no `Idempotency-Key`. The provider returns the
        verdict. BrewPay stores it and does not invent an approval.

        `dateOfBirth` is `YYYY-MM-DD` and is not after today.
        `identificationNumber` is 11 digits. The response returns that
        number. The audit does not. `GET /api/v1/users` shows `kycStatus`
        and does not show the number.

        `APPROVED` sets that user's `kycStatus` to `APPROVED`. It does not
        change `status`, which stays `ACTIVE`. `PENDING` leaves the user
        unverified. `REJECTED` can be submitted again.

        A second submit while the status is `PENDING` is 409
        `Identity verification is already in review.` A second submit after
        `APPROVED` is 409 `Identity is already verified.` Neither calls the
        provider again.

        The call posts no journal. On the local fake the verdict is
        `APPROVED` unless a test scripts the person queue.

        - 400 `Date of birth is invalid.` The provider is not called.
        - 400 `Phone number is invalid.` The provider is not called.
        - 400 `Identification number is invalid.` The provider is not called.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitKycRequest"
            example:
              dateOfBirth: "1990-04-12"
              phone: "08031234567"
              identificationNumber: "22123456789"
      responses:
        "201":
          description: The provider verdict was stored for this user.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmission"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Identity verification is already pending or already approved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: CONFLICT
                message: Identity verification is already in review.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
    get:
      tags: [Identity verification]
      operationId: listKycSubmissions
      summary: List the signed-in user's identity submissions
      description: |
        Oldest first. Only that user's rows. Another user in the same
        organization, including the owner, does not see these rows.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Submissions for the signed-in user.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KycSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/kyc-submissions/{id}:
    get:
      tags: [Identity verification]
      operationId: getKycSubmission
      summary: Read one identity submission for the signed-in user
      description: |
        Another user's id, another organization's id, and an unknown id are
        all 404 `KYC submission was not found.` `X-Organization-Id` does not
        change that.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The submission.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycSubmission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No submission with that id for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: KYC submission was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Sign in
      description: |
        Public. The body must name the organization, the email, and the
        password. Wrong password, unknown email, and unknown organization all
        return the same 401 so the app cannot tell which one failed.

        Store `token` only in memory if you can. It is shown once. Send it as
        `Authorization: Bearer <token>`. The server stores a SHA-256 hash.

        `expiresAt` is 12 hours after login unless the user signs out. There
        is no refresh token. On 401 `Session is invalid.`, send the user to
        sign in again.

        The body does not include the role. After login, call `GET /api/v1/users`
        and find the row whose `id` equals `userId`.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            example:
              organizationId: 4f3b1c0a-6d2e-4a18-9b77-1c2d3e4f5a6b
              email: ada@example.com
              password: password-1
      responses:
        "201":
          description: Session created. The token is in this body only.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          description: Email or password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: UNAUTHORIZED
                message: Email or password is wrong.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/sessions/current:
    delete:
      tags: [Sessions]
      operationId: revokeSession
      summary: Sign out
      description: |
        Revokes the session in the `Authorization` header. The next call with
        that token returns 401 `Session is invalid.` Owner and staff can both
        sign out. The response has no body.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: The session was revoked.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Add a staff user
      description: |
        Owner only. Creates a `STAFF` user in the signed-in organization.
        The owner chooses that person's first password. There is no invite
        email. Email is unique inside the organization and is stored in
        lowercase. The same email may exist in a second organization.

        Staff who call this get 403 `You do not have permission to perform this action.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            example:
              firstName: Chi
              lastName: Nwosu
              email: chi@example.com
              password: password-1
      responses:
        "201":
          description: Staff user created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That email is already in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: CONFLICT
                message: A user with this email already exists in the organization.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users in this organization
      description: |
        Owner and staff. Oldest first. Use this after login to read the
        caller's `role`. Passwords are not included.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Users in the signed-in organization.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users/{id}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Read one user in this organization
      description: |
        Owner and staff. A user from another organization and an unknown id
        both return 404 `User was not found.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The user.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: User was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Read the append-only audit
      description: |
        Owner only. Oldest first. Staff receive 403.

        Each row is an action, a target type, and sometimes a target id.
        Denial rows have a null `targetId`. The rows do not contain the
        password, the session token, the webhook secret, the idempotency key,
        a destination account number, or an amount.

        There is no filter and no detail endpoint. Build the audit screen
        from this list.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Audit rows for this organization.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/ledger/accounts:
    post:
      tags: [Ledger]
      operationId: createLedgerAccount
      summary: Create a ledger account
      description: |
        Owner only. Do this before a collection account or a transfer.

        `code` is stored in uppercase and is unique inside the organization.
        `type` is `ASSET`, `LIABILITY`, `EQUITY`, `INCOME`, or `EXPENSE`.

        For collections and transfers the app needs two accounts:

        - clearing, type `ASSET`
        - merchant, type `LIABILITY`

        A duplicate code returns 409 `An account with this code already exists in the organization.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            examples:
              clearing:
                value:
                  code: clearing
                  name: Clearing
                  type: ASSET
              merchant:
                value:
                  code: merchant
                  name: Merchant funds
                  type: LIABILITY
      responses:
        "201":
          description: Account created.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerAccount"
        "400":
          $ref: "#/components/responses/ValidationOrBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The code is already used in this organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: CONFLICT
                message: An account with this code already exists in the organization.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
    get:
