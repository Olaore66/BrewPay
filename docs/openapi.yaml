          description: Beneficiary was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: Beneficiary was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/reconciliation-runs:
    post:
      tags: [Reconciliation]
      operationId: runReconciliation
      summary: Compare the bank statement with the ledger
      description: |
        Owner only. No request body. The statement comes from the bank. The
        merchant app cannot upload lines. On the local fake the statement
        starts empty, so a run often returns an empty `findings` list and
        HTTP 201.

        The run does not post a journal, reverse a journal, or change a
        collection or a transfer. A transfer that is `UNKNOWN` stays
        `UNKNOWN` even if the statement later says success. That case is a
        `STATUS_MISMATCH` finding.

        The same mismatch on a later run returns the first finding id and
        still records a new run. Build the screen from `findings` on this
        response, or from `GET /api/v1/reconciliation-findings`.

        There is no get-run-by-id route. `id` on this response is the run id.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "201":
          description: The run and the findings from this look.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reconciliation-findings:
    get:
      tags: [Reconciliation]
      operationId: listReconciliationFindings
      summary: List reconciliation findings
      description: |
        Owner only. Oldest first. Codes are `STATUS_MISMATCH`,
        `AMOUNT_MISMATCH`, `MISSING_ON_LEDGER`, and `MISSING_AT_PROVIDER`.
        `subjectType` is `COLLECTION` or `TRANSFER`. Some amount and status
        fields are null when that side has no value.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Findings in this organization.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReconciliationFinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reconciliation-findings/{id}:
    get:
      tags: [Reconciliation]
      operationId: getReconciliationFinding
      summary: Read one reconciliation finding
      description: |
        Owner only. Another organization's finding and an unknown id both
        return 404 `Reconciliation finding was not found.`
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The finding.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationFinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Reconciliation finding was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: Reconciliation finding was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []

  /api/v1/webhooks/fake-bank:
    post:
      tags: [Fake bank]
      operationId: receiveFakeBankWebhook
      summary: Bank webhook that credits a collection
      description: |
        Not for the merchant app. The bank calls this. It is public and does
        not use the session. The header `X-Fake-Bank-Signature` is the hex
        HMAC-SHA256 of the raw body. A bad signature returns 401
        `Webhook signature is invalid.`

        A `SUCCESSFUL` body posts one journal and returns 201. Sending the
        same `eventId` again returns that same collection and does not post
        a second journal. A different amount with the same event returns 409.

        `PENDING`, `FAILED`, and `UNKNOWN` return 200 and store nothing.
        `collection` is null on that response. A later success with that
        event can still credit.

        The frontend sees the result on `GET /api/v1/collections`.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: X-Fake-Bank-Signature
          in: header
          required: true
          description: Hex HMAC-SHA256 of the raw body. Local fake secret only.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FakeBankWebhook"
            example:
              eventId: evt-2026-0001
              accountReference: FAKE-4f3b1c0a-6d2e-4a18-9b77-1c2d3e4f5a6b
              amountKobo: 150000
              status: SUCCESSFUL
      responses:
        "201":
          description: A collection was stored.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionWebhookResult"
        "200":
          description: The event was not successful, so nothing was stored.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionWebhookResult"
              example:
                status: PENDING
                collection: null
        "400":
          description: The body could not be read, or the amount was not positive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Webhook signature is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: UNAUTHORIZED
                message: Webhook signature is invalid.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
        "404":
          description: Collection account was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: NOT_FOUND
                message: Collection account was not found.
                correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
                details: []
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token from `POST /api/v1/sessions`. Send
        `Authorization: Bearer <token>`. Missing or malformed credentials
        return 401 `Authentication is required.` A revoked, expired, or
        unknown token returns 401 `Session is invalid.`
  headers:
    CorrelationId:
      description: The correlation id the server kept for this call.
      schema:
        type: string
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Optional. 8 to 64 characters. Starts with a letter or digit, then
        letters, digits, `.`, `_`, and `-`. Unsafe values are replaced.
      schema:
        type: string
        minLength: 8
        maxLength: 64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on journal post and transfer submit. 8 to 128 characters.
        Starts with a letter or digit, then letters, digits, `.`, `_`, `:`,
        and `-`. One key per confirmed user action.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: |
        `Authentication is required.` or `Session is invalid.`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: UNAUTHORIZED
            message: Authentication is required.
            correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
            details: []
    Forbidden:
      description: |
        Staff receive `You do not have permission to perform this action.`
        An owner whose business is not approved receives
        `Business verification is not complete.` on money routes. An owner
        whose business is approved and whose identity is not receives
        `Identity verification is not complete.`
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: FORBIDDEN
            message: You do not have permission to perform this action.
            correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
            details: []
    ValidationOrBadRequest:
      description: |
        `VALIDATION_FAILED` with `Request validation failed.` and a `details`
        list, or `BAD_REQUEST` with one message and an empty `details` list.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    IdempotencyConflict:
      description: This key was already stored with a different body.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            code: CONFLICT
            message: Idempotency key was already used with a different request.
            correlationId: 2f1c8a0e-4b6d-4e2a-9c1f-0a1b2c3d4e5f
            details: []
  schemas:
    ApiError:
      type: object
      required: [code, message, correlationId, details]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INTERNAL_ERROR
        message:
          type: string
          description: |
            Safe text for the UI. A 500 is always `Something went wrong.`
        correlationId:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/FieldViolation"
    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: UP
    CreateOrganizationRequest:
      type: object
      required: [name, owner]
      properties:
        name:
          type: string
          maxLength: 160
          description: Display name of the business. Not a unique key.
        owner:
          $ref: "#/components/schemas/CreateOwner"
    CreateOwner:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    Organization:
      type: object
      required: [id, name, status, kycStatus, owner]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [PENDING, ACTIVE]
          description: |
            `PENDING` until KYB is approved. `ACTIVE` after an `APPROVED`
            verdict. A rejection leaves this `PENDING`.
        kycStatus:
          type: string
          enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED]
        owner:
          $ref: "#/components/schemas/User"
    CreateSessionRequest:
      type: object
      required: [organizationId, email, password]
      properties:
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          maxLength: 72
    Session:
      type: object
      required: [id, organizationId, userId, token, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        token:
          type: string
          description: Shown once. Send it as a Bearer token.
        expiresAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    User:
      type: object
      required: [id, organizationId, firstName, lastName, email, status, kycStatus, role]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [ACTIVE]
        kycStatus:
          type: string
          enum: [NOT_SUBMITTED, PENDING, APPROVED, REJECTED]
          description: |
            This person's provider verdict. `NOT_SUBMITTED` until they call
            `POST /api/v1/kyc-submissions`. This is not the identification
            number.
        role:
          type: string
          enum: [OWNER, STAFF]
    AuditEvent:
      type: object
      required: [id, organizationId, actorUserId, action, targetType, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        action:
          type: string
          description: One of the audit action names.
          enum:
            - SESSION_CREATED
            - SESSION_REJECTED
            - SESSION_REVOKED
            - USER_CREATED
            - USER_CREATE_DENIED
            - AUDIT_READ_DENIED
            - ACCOUNT_CREATED
            - JOURNAL_POSTED
            - JOURNAL_REVERSED
            - JOURNAL_POST_DENIED
            - JOURNAL_REVERSE_DENIED
            - COLLECTION_ACCOUNT_OPENED
            - COLLECTION_ACCOUNT_OPEN_DENIED
            - COLLECTION_CREDITED
            - TRANSFER_SUBMITTED
            - TRANSFER_SUBMIT_DENIED
            - RECONCILIATION_RUN
            - RECONCILIATION_RUN_DENIED
            - ACCOUNT_NAME_ENQUIRED
            - ACCOUNT_NAME_ENQUIRY_DENIED
            - BENEFICIARY_CREATED
            - BENEFICIARY_CREATE_DENIED
            - KYB_SUBMITTED
            - KYB_SUBMIT_DENIED
            - KYC_SUBMITTED
        targetType:
          type: string
          enum:
            - SESSION
            - USER
            - AUDIT
            - ACCOUNT
            - JOURNAL
            - COLLECTION_ACCOUNT
            - COLLECTION
            - TRANSFER
            - RECONCILIATION_RUN
            - ACCOUNT_NAME_ENQUIRY
            - BENEFICIARY
            - KYB_SUBMISSION
            - KYC_SUBMISSION
        targetId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateAccountRequest:
      type: object
      required: [code, name, type]
      properties:
        code:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 160
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
    LedgerAccount:
      type: object
      required: [id, organizationId, code, name, type]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, INCOME, EXPENSE]
    PostJournalRequest:
      type: object
      required: [description, lines]
      properties:
        description:
          type: string
          maxLength: 200
        lines:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/JournalLineRequest"
    JournalLineRequest:
      type: object
      required: [accountId, direction, amountKobo]
      properties:
        accountId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        amountKobo:
          type: integer
          format: int64
          minimum: 1
    Journal:
      type: object
      required: [id, organizationId, description, currency, createdAt, lines]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        description:
          type: string
        currency:
          type: string
          enum: [NGN]
        reversesJournalId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: "#/components/schemas/JournalLine"
    JournalLine:
      type: object
      required: [accountId, direction, amountKobo, position]
      properties:
        accountId:
          type: string
          format: uuid
        direction:
          type: string
          enum: [DEBIT, CREDIT]
        amountKobo:
          type: integer
          format: int64
        position:
          type: integer
    OpenCollectionAccountRequest:
      type: object
      required: [clearingAccountId, merchantAccountId]
      properties:
        clearingAccountId:
          type: string
          format: uuid
          description: Must be an ASSET ledger account in this organization.
        merchantAccountId:
          type: string
          format: uuid
          description: Must be a LIABILITY ledger account in this organization.
    CollectionAccount:
      type: object
      required: [id, organizationId, externalReference, clearingAccountId, merchantAccountId]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        externalReference:
          type: string
          description: The reference the customer pays. Local values start with FAKE-.
        clearingAccountId:
          type: string
          format: uuid
        merchantAccountId:
          type: string
          format: uuid
    Collection:
      type: object
      required: [id, organizationId, collectionAccountId, providerEventId, amountKobo, journalId]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        collectionAccountId:
          type: string
          format: uuid
        providerEventId:
          type: string
        amountKobo:
          type: integer
          format: int64
        journalId:
          type: string
          format: uuid
    SubmitTransferRequest:
      type: object
      required:
        - clearingAccountId
        - merchantAccountId
        - amountKobo
        - destinationAccountNumber
        - destinationBankCode
      properties:
        clearingAccountId:
          type: string
          format: uuid
        merchantAccountId:
          type: string
          format: uuid
        amountKobo:
          type: integer
          format: int64
          minimum: 1
        destinationAccountNumber:
          type: string
          description: 10 digits after trim.
          example: "0123456789"
        destinationBankCode:
          type: string
          description: 3 to 6 digits after trim.
          example: "058"
    Transfer:
      type: object
      required:
        - id
        - organizationId
        - status
        - amountKobo
        - destinationAccountNumber
        - destinationBankCode
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        status:
          type: string
          enum: [SUCCESSFUL, FAILED, UNKNOWN]
        amountKobo:
          type: integer
          format: int64
        destinationAccountNumber:
          type: string
        destinationBankCode:
          type: string
        providerReference:
          type: string
          nullable: true
        journalId:
          type: string
          format: uuid
          nullable: true
    DestinationAccountRequest:
      type: object
      required: [destinationAccountNumber, destinationBankCode]
      properties:
        destinationAccountNumber:
          type: string
          description: 10 digits after trim.
          example: "0123456789"
        destinationBankCode:
          type: string
          description: 3 to 6 digits after trim.
          example: "058"
    AccountNameEnquiry:
      type: object
      required:
        - id
        - organizationId
        - destinationAccountNumber
        - destinationBankCode
        - accountName
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        destinationAccountNumber:
          type: string
        destinationBankCode:
          type: string
        accountName:
          type: string
    SubmitKybRequest:
      type: object
      required: [tradingName, businessType, addressLine, state, category]
      properties:
        tradingName:
          type: string
          maxLength: 160
        businessType:
          type: string
          enum: [SOLE_PROPRIETOR, PARTNERSHIP, LIMITED_COMPANY]
        registrationNumber:
          type: string
          maxLength: 40
          nullable: true
          description: |
            Required for `PARTNERSHIP` and `LIMITED_COMPANY`. Omitted or
            blank for a sole proprietor is stored as null.
        addressLine:
          type: string
          maxLength: 200
        state:
          type: string
          maxLength: 40
        category:
          type: string
          maxLength: 80
    KybSubmission:
      type: object
      required:
        - id
        - organizationId
        - tradingName
        - businessType
        - addressLine
        - state
        - category
        - kycStatus
        - organizationStatus
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        tradingName:
          type: string
        businessType:
          type: string
          enum: [SOLE_PROPRIETOR, PARTNERSHIP, LIMITED_COMPANY]
        registrationNumber:
          type: string
          nullable: true
          description: Returned on the submission. It is not written to the audit.
        addressLine:
          type: string
        state:
          type: string
        category:
          type: string
        kycStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
          description: The provider verdict stored on this submission.
        organizationStatus:
          type: string
          enum: [PENDING, ACTIVE]
          description: |
            The organization's status when this response was built. It becomes
            `ACTIVE` when a verdict is `APPROVED`. Older rows in a later list
            show that current status too.
    SubmitKycRequest:
      type: object
      required: [dateOfBirth, phone, identificationNumber]
      properties:
        dateOfBirth:
          type: string
          format: date
          description: `YYYY-MM-DD`. Not after today.
        phone:
          type: string
          description: 8 to 15 digits, with an optional leading `+`.
        identificationNumber:
          type: string
          description: 11 digits. The provider decides whether this is a BVN or a NIN.
    KycSubmission:
      type: object
      required:
        - id
        - organizationId
        - userId
        - dateOfBirth
        - phone
        - identificationNumber
        - kycStatus
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        dateOfBirth:
          type: string
          format: date
        phone:
          type: string
        identificationNumber:
          type: string
          description: Returned on this user's submission. It is not written to the audit.
        kycStatus:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
    Beneficiary:
      type: object
      required:
        - id
        - organizationId
        - destinationAccountNumber
        - destinationBankCode
        - accountName
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        destinationAccountNumber:
          type: string
        destinationBankCode:
          type: string
        accountName:
          type: string
          description: The name from the first successful save. Later saves do not change it.
    ReconciliationRun:
      type: object
      required: [id, findings]
      properties:
        id:
          type: string
          format: uuid
          description: The run id. There is no get-by-id for the run.
        findings:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationFinding"
    ReconciliationFinding:
      type: object
      required: [id, organizationId, code, subjectType]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        code:
          type: string
          enum:
            - STATUS_MISMATCH
            - AMOUNT_MISMATCH
            - MISSING_ON_LEDGER
            - MISSING_AT_PROVIDER
        subjectType:
          type: string
          enum: [COLLECTION, TRANSFER]
