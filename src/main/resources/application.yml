spring:
  application:
    name: brewpay
  mvc:
    problemdetails:
      enabled: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

# Recorded for the next slice. This slice does not open a connection.
brewpay:
  database:
    url: jdbc:postgresql://localhost:5432/brewpay_db
    username: ${BREWPAY_DB_USER:brewpay}
    password: ${BREWPAY_DB_PASSWORD:}
